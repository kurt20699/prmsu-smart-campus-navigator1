<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRMSU QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #1e5b7a;
            --dark: #0f3a52;
            --light-blue: #e8f4f8;
            --accent: #34a853;
            --white: #ffffff;
            --gray: #f5f7fa;
            --border: #dde3ea;
            --text: #1a2332;
            --muted: #6b7a8d;
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--gray);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: 'Sora', sans-serif;
            transition: all 0.2s;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-primary:hover { background: var(--light-blue); }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1.5px solid rgba(255,255,255,0.5);
        }

        .btn-outline:hover { background: rgba(255,255,255,0.1); }

        /* Controls */
        .controls {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .controls label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .campus-select {
            padding: 8px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            background: white;
            cursor: pointer;
            outline: none;
        }

        .campus-select:focus { border-color: var(--primary); }

        .count-badge {
            margin-left: auto;
            background: var(--light-blue);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* Grid */
        .grid-container {
            padding: 28px 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* QR Card */
        .qr-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: box-shadow 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .qr-card:hover {
            box-shadow: 0 8px 24px rgba(30, 91, 122, 0.12);
            transform: translateY(-2px);
        }

        .qr-card-header {
            background: linear-gradient(135deg, var(--dark), var(--primary));
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qr-card-header .building-id {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.15);
            padding: 2px 7px;
            border-radius: 20px;
        }

        .qr-card-header .building-type {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            margin-left: auto;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .qr-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .qr-code-wrapper {
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
        }

        .qr-code-wrapper canvas,
        .qr-code-wrapper img {
            width: 124px !important;
            height: 124px !important;
        }

        .qr-info {
            text-align: center;
            width: 100%;
        }

        .qr-building-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
            margin-bottom: 3px;
        }

        .qr-short-name {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
        }

        .qr-floor {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        .qr-card-footer {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            flex: 1;
            padding: 7px 0;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: 'Sora', sans-serif;
            transition: all 0.2s;
        }

        .btn-download {
            background: var(--primary);
            color: white;
        }

        .btn-download:hover { background: var(--dark); }

        .btn-print-single {
            background: var(--gray);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-print-single:hover { background: var(--light-blue); color: var(--primary); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        /* Print styles */
        @media print {
            .header, .controls, .qr-card-footer { display: none !important; }
            body { background: white; }
            .grid-container { padding: 0; }
            .qr-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
            .qr-card { break-inside: avoid; border: 1px solid #ccc; }
            .qr-card:hover { transform: none; box-shadow: none; }
        }

        @media (max-width: 600px) {
            .header { padding: 16px 20px; }
            .controls { padding: 12px 20px; }
            .grid-container { padding: 20px 16px; }
            .qr-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1>🎓 PRMSU QR Code Generator</h1>
        <p>Generate and print QR codes for all campus buildings</p>
    </div>
    <div class="header-actions">
        <button class="btn btn-outline" onclick="window.print()">🖨️ Print All</button>
        <button class="btn btn-primary" onclick="downloadAll()">⬇️ Download All</button>
    </div>
</div>

<div class="controls">
    <label>Campus:</label>
    <select class="campus-select" id="campusSelect" onchange="renderQRCodes()">
        <option value="iba">Iba Campus</option>
        <option value="olongapo">Olongapo Campus</option>
        <option value="san_antonio">San Antonio Campus</option>
        <option value="san_narciso">San Narciso Campus</option>
        <option value="san_felipe">San Felipe Campus</option>
        <option value="masinloc">Masinloc Campus</option>
        <option value="candelaria">Candelaria Campus</option>
    </select>
    <span class="count-badge" id="countBadge">0 buildings</span>
</div>

<div class="grid-container">
    <div class="qr-grid" id="qrGrid"></div>
</div>

<script>
const campusData = {
    iba: {
        name: "Iba Campus",
        locations: [
            { id: 1,  name: "College of Communication and Information Technology", shortName: "CCIT", type: "department" },
            { id: 2,  name: "College of Nursing", shortName: "CON", type: "department" },
            { id: 3,  name: "College of Engineering", shortName: "COE", type: "department" },
            { id: 4,  name: "College of Physical Education", shortName: "CPE", type: "department" },
            { id: 5,  name: "Gymnasium", shortName: "GYM", type: "facilities" },
            { id: 6,  name: "Science and Engineering Laboratory Building", shortName: "SELB", type: "department" },
            { id: 7,  name: "College of Business Accountancy and Public Administration", shortName: "CBAPA", type: "department" },
            { id: 8,  name: "College of Law", shortName: "LAW", type: "department" },
            { id: 9,  name: "Admin Building", shortName: "ADMIN", type: "administration" },
            { id: 10, name: "President Ramon Magsaysay Statue PRMSU", shortName: "STATUE", type: "landmark" },
            { id: 11, name: "PRMSU Registrar Building", shortName: "REGISTRAR", type: "administration" },
            { id: 12, name: "E-Library", shortName: "LIBRARY", type: "facilities" },
            { id: 13, name: "College of Tourism and Hospitality Management", shortName: "CTHM", type: "department" },
            { id: 14, name: "Gender and Development Center", shortName: "GAD", type: "office" },
            { id: 15, name: "Cafeteria", shortName: "CAFETERIA", type: "facilities" },
            { id: 16, name: "College of Industrial Technology", shortName: "CIT", type: "department" },
            { id: 17, name: "College of Teacher Education", shortName: "CTE", type: "department" },
            { id: 18, name: "University Health Clinic", shortName: "CLINIC", type: "facilities" },
            { id: 19, name: "Entrance Gate", shortName: "ENTRANCE GATE", type: "landmark" },
            { id: 20, name: "Exit Gate", shortName: "EXIT GATE", type: "landmark" },
            { id: 21, name: "PRMSU Dormitory", shortName: "DORMITORY", type: "facilities" },
            { id: 22, name: "New Gymnasium", shortName: "NEW GYM", type: "facilities" },
            { id: 23, name: "College of Accountancy and Business Administration", shortName: "CABA", type: "department" },
            { id: 24, name: "RMTU Multipurpose Cooperative", shortName: "COOP", type: "facilities" },
            { id: 25, name: "Psychology Annex Building", shortName: "ANNEX", type: "department" },
            { id: 26, name: "College of Arts and Sciences", shortName: "CAS", type: "department" },
            { id: 27, name: "Automotive Technology", shortName: "AUTOMOTIVE", type: "department" },
            { id: 28, name: "Food Technology / Food Service Management", shortName: "FSMT", type: "department" },
            { id: 29, name: "Mechanical Technology", shortName: "MECH", type: "department" },
            { id: 30, name: "New Building", shortName: "NEW BUILDING", type: "department" },
            { id: 31, name: "Civil Technology", shortName: "CIVIL", type: "department" },
            { id: 32, name: "Science-Based Education Building", shortName: "SBEB", type: "department" },
            { id: 33, name: "Drafting Technology", shortName: "DRAFTING", type: "department" },
            { id: 34, name: "Graduate School", shortName: "GRADUATE SCHOOL", type: "department" },
            { id: 35, name: "Nursing Skills Laboratory Building", shortName: "NSLB", type: "department" },
            { id: 36, name: "ROTC Office", shortName: "ROTC", type: "office" },
            { id: 37, name: "Student Services and Quality Assurance Building", shortName: "SSQAB", type: "office" },
            { id: 38, name: "Tourism and Hospitality Management Building", shortName: "THM BUILDING", type: "department" },
        ]
    },
    olongapo: { name: "Olongapo Campus", locations: [] },
    san_antonio: { name: "San Antonio Campus", locations: [] },
    san_narciso: { name: "San Narciso Campus", locations: [] },
    san_felipe: { name: "San Felipe Campus", locations: [] },
    masinloc: { name: "Masinloc Campus", locations: [] },
    candelaria: { name: "Candelaria Campus", locations: [] },
};
// ─────────────────────────────────────────────────────────────────────────────

const typeColors = {
    administration: '#2c5aa0',
    department: '#34a853',
    facilities: '#f9a825',
    office: '#ea4335',
    landmark: '#9c27b0',
};

function getTypeColor(type) {
    return typeColors[type] || '#1e5b7a';
}

function renderQRCodes() {
    const campus = document.getElementById('campusSelect').value;
    const grid = document.getElementById('qrGrid');
    const badge = document.getElementById('countBadge');
    const data = campusData[campus];

    grid.innerHTML = '';

    if (!data || !data.locations || data.locations.length === 0) {
        grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
                <div class="icon">🏫</div>
                <p>No buildings found for this campus.<br>Add locations to campusData to generate QR codes.</p>
            </div>`;
        badge.textContent = '0 buildings';
        return;
    }

    badge.textContent = `${data.locations.length} building${data.locations.length !== 1 ? 's' : ''}`;

    data.locations.forEach(loc => {
        const qrData = JSON.stringify({
            campus: campus,
            buildingId: loc.id,
            floor: "Ground Floor"
        });

        const card = document.createElement('div');
        card.className = 'qr-card';
        card.id = `card-${campus}-${loc.id}`;

        const typeColor = getTypeColor(loc.type);

        card.innerHTML = `
            <div class="qr-card-header" style="background: linear-gradient(135deg, ${typeColor}dd, ${typeColor});">
                <span class="building-id">#${loc.id}</span>
                <span class="building-type">${loc.type || 'building'}</span>
            </div>
            <div class="qr-body">
                <div class="qr-code-wrapper" id="qr-${campus}-${loc.id}"></div>
                <div class="qr-info">
                    <div class="qr-building-name">${loc.name}</div>
                    ${loc.shortName ? `<div class="qr-short-name">${loc.shortName}</div>` : ''}
                    <div class="qr-floor">Ground Floor</div>
                </div>
            </div>
            <div class="qr-card-footer">
                <button class="btn-sm btn-download" onclick="downloadQR('${campus}', ${loc.id}, '${loc.shortName || loc.name}')">⬇️ Save</button>
                <button class="btn-sm btn-print-single" onclick="printSingle('${campus}', ${loc.id})">🖨️ Print</button>
            </div>
        `;

        grid.appendChild(card);

        // Generate QR code
        new QRCode(document.getElementById(`qr-${campus}-${loc.id}`), {
            text: qrData,
            width: 124,
            height: 124,
            colorDark: "#1e5b7a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    });
}

function downloadQR(campus, buildingId, name) {
    setTimeout(() => {
        const wrapper = document.getElementById(`qr-${campus}-${buildingId}`);
        const canvas = wrapper.querySelector('canvas');
        if (!canvas) { alert('QR code not ready yet, please try again.'); return; }

        const link = document.createElement('a');
        link.download = `QR_${campus}_${name.replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }, 300);
}

function downloadAll() {
    const campus = document.getElementById('campusSelect').value;
    const data = campusData[campus];
    if (!data || !data.locations.length) return;

    data.locations.forEach((loc, i) => {
        setTimeout(() => {
            downloadQR(campus, loc.id, loc.shortName || loc.name);
        }, i * 400);
    });
}

function printSingle(campus, buildingId) {
    const wrapper = document.getElementById(`qr-${campus}-${buildingId}`);
    const canvas = wrapper.querySelector('canvas');
    if (!canvas) return;

    const imgSrc = canvas.toDataURL('image/png');
    const loc = campusData[campus].locations.find(l => l.id === buildingId);

    const win = window.open('', '_blank');
    win.document.write(`
        <!DOCTYPE html><html><head>
        <title>QR - ${loc.name}</title>
        <style>
            body { font-family: sans-serif; text-align: center; padding: 40px; }
            img { width: 200px; height: 200px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
            h2 { margin-top: 16px; font-size: 18px; }
            p { color: #666; font-size: 13px; margin-top: 6px; }
            .campus { font-size: 11px; color: #999; margin-top: 4px; }
        </style></head><body>
        <img src="${imgSrc}" />
        <h2>${loc.name}</h2>
        ${loc.shortName ? `<p>${loc.shortName}</p>` : ''}
        <p class="campus">PRMSU — ${campusData[campus].name}</p>
        <script>window.onload = () => { window.print(); window.close(); }<\/script>
        </body></html>
    `);
    win.document.close();
}

// Init
renderQRCodes();
</script>
</body>
</html>
